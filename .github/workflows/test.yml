name: Test

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels that pull request's run still in progress. Every other run (pushes to main) gets a
# group of its own: GitHub keeps only one pending run per group, so a shared group could still drop a main run.
concurrency:
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        php: ['8.0', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Syntax
        run: for f in $(git ls-files '*.php'); do php -l "$f" || exit 1; done
      - name: Unit tests
        run: php tests/test.php
      - name: Script syntax
        run: node --check assets/inquiry.js && node tests/inquiry.test.js && node --check assets/form-alert.js && node tests/form-alert.test.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Alert service
        run: node tests/worker.test.mjs
